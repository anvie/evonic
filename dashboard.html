
    <!DOCTYPE html>
    <html lang="en">
    <head>

        <title>Monthly Sales Dashboard</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #f0f2f5;

                justify-content: center;
                padding: 50px;
            }
            .card {
                background: white;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 8px 16px rgba(0,0,0,0.1);

                width: 100%;
            }
            h1 {
                color: #1a73e8;
                border-bottom: 2px solid #e8f0fe;
                padding-bottom: 15px;
                margin-bottom: 20px;
            }
            pre {
                background: #f8f9fa;
                padding: 20px;
                border-radius: 8px;
                white-space: pre-wrap;
                font-size: 1.2em;
                color: #3c4043;
                border: 1px solid #dadce0;
            }
        </style>
    </head>
