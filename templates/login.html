<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Evonic</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}?v=1" sizes="any">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}?v=1" sizes="32x32">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}?v=1" sizes="16x16">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}?v=1" sizes="180x180">
    <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}?v=1">
    <script>
    // Anti-flash: apply theme + page background before first paint (synchronous, render-blocking)
    (function() {
        var t = localStorage.getItem('evonic-theme') || 'system';
        var isDark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
            document.documentElement.classList.add('dark');
        }
        // Set html background inline so it paints instantly — eliminates flash between navigations
        document.documentElement.style.backgroundColor = isDark ? '#0a0f1c' : '#f1f3fb';
    })();
    </script>
    {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
    <style>
    /* ── Login: glass card on a flat background, same language as the app (pills, glass, indigo) ── */
    :root {
        --lg-bg: #f1f3fb; --lg-accent: #4f46e5; --lg-accent-hover: #4338ca; --lg-brand: #4338ca;
        --lg-glow: rgb(99 102 241 / .30);
        --lg-card: rgb(255 255 255 / .72); --lg-card-border: rgb(148 163 184 / .35);
        --lg-text: #0f172a; --lg-muted: #475569; --lg-ph: #64748b; --lg-field: rgb(255 255 255 / .92); --lg-field-border: #cbd5e1;
        --lg-shadow: 0 1px 2px rgb(15 23 42 / .06), 0 30px 60px -24px rgb(49 46 129 / .35);
    }
    html.dark {
        --lg-bg: #0a0f1c; --lg-accent: #6366f1; --lg-accent-hover: #7c7ff5; --lg-brand: #c7d2fe;
        --lg-glow: rgb(79 70 229 / .42);
        --lg-card: rgb(17 24 39 / .62); --lg-card-border: rgb(148 163 184 / .2);
        --lg-text: #f1f5f9; --lg-muted: #a3b1c6; --lg-ph: #94a3b8; --lg-field: rgb(15 23 42 / .7); --lg-field-border: #334155;
        --lg-shadow: 0 1px 2px rgb(0 0 0 / .3), 0 30px 60px -24px rgb(0 0 0 / .7);
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; color: var(--lg-text); background-color: var(--lg-bg);
        -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .lg-wrap { position: relative; z-index: 1; width: 100%; max-width: 25rem; display: flex; flex-direction: column; align-items: center; }
    .lg-mascot { position: relative; width: 8.5rem; margin-bottom: .5rem; }
    .lg-mascot::before { content: ""; position: absolute; inset: 12% 8% 0; border-radius: 50%; background: var(--lg-glow); filter: blur(28px); opacity: .9; z-index: 0; }
    .lg-mascot img { position: relative; z-index: 1; display: block; width: 100%; height: auto; animation: lg-float 5s ease-in-out infinite; }
    @keyframes lg-float { 50% { transform: translateY(-8px); } }
    .lg-brand { margin: .25rem 0 0; font-size: 1.25rem; font-weight: 700; letter-spacing: .32em; text-indent: .32em; color: var(--lg-brand); }
    .lg-tag { margin: .5rem 0 1.75rem; font-size: .9375rem; color: var(--lg-muted); letter-spacing: -.005em; }
    .lg-card { width: 100%; padding: 1.5rem; border-radius: 1.75rem; border: 1px solid var(--lg-card-border); background: var(--lg-card);
        -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); box-shadow: var(--lg-shadow), inset 0 1px 0 rgb(255 255 255 / .06); animation: lg-in .7s cubic-bezier(.16, 1, .3, 1) .12s both; }
    @keyframes lg-in { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes lg-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .lg-mascot, .lg-brand, .lg-tag, .lg-foot { animation: lg-rise .7s cubic-bezier(.16, 1, .3, 1) both; }
    .lg-mascot { animation-delay: .02s; } .lg-brand { animation-delay: .1s; } .lg-tag { animation-delay: .16s; } .lg-foot { animation-delay: .5s; }
    .lg-error { display: flex; align-items: flex-start; gap: .625rem; margin-bottom: 1rem; padding: .75rem .875rem; border-radius: 1rem; font-size: .8125rem; line-height: 1.4;
        color: #b91c1c; background: rgb(239 68 68 / .1); border: 1px solid rgb(239 68 68 / .3); }
    html.dark .lg-error { color: #fca5a5; background: rgb(239 68 68 / .14); border-color: rgb(248 113 113 / .35); }
    .lg-error svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
    .lg-notice { display: flex; align-items: flex-start; gap: .625rem; margin-bottom: 1rem; padding: .75rem .875rem; border-radius: 1rem; font-size: .8125rem; line-height: 1.4;
        color: #15803d; background: rgb(34 197 94 / .1); border: 1px solid rgb(34 197 94 / .3); }
    html.dark .lg-notice { color: #86efac; background: rgb(34 197 94 / .14); border-color: rgb(74 222 128 / .35); }
    .lg-notice svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
    .lg-label { display: block; margin: 0 0 .375rem .75rem; font-size: .8125rem; font-weight: 600; color: var(--lg-muted); }
    .lg-field { position: relative; margin-bottom: 1rem; }
    .lg-ico { position: absolute; left: 1rem; top: 50%; width: 1.0625rem; height: 1.0625rem; transform: translateY(-50%); color: #94a3b8; pointer-events: none; transition: color .15s; }
    .lg-field:focus-within .lg-ico { color: #6366f1; }
    .lg-input { display: block; width: 100%; height: 3rem; padding: 0 3rem 0 2.75rem; border-radius: 9999px; font: inherit; font-size: .9375rem; color: var(--lg-text);
        background: var(--lg-field); border: 1px solid var(--lg-field-border); outline: none; transition: border-color .15s, box-shadow .15s; }
    .lg-input::placeholder { color: var(--lg-ph); opacity: 1; }
    .lg-input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px rgb(99 102 241 / .16); }
    .lg-eye { position: absolute; right: .375rem; top: 50%; width: 2.25rem; height: 2.25rem; transform: translateY(-50%); display: inline-flex; align-items: center; justify-content: center;
        border: 0; border-radius: 50%; background: transparent; color: #94a3b8; cursor: pointer; transition: background-color .15s, color .15s; }
    .lg-eye:hover { background: rgb(148 163 184 / .16); color: var(--lg-text); }
    .lg-eye svg { width: 18px; height: 18px; }
    .lg-eye .off { display: none; }
    .lg-eye.is-shown .on { display: none; }
    .lg-eye.is-shown .off { display: block; }
    .lg-turnstile { display: flex; justify-content: center; margin-bottom: 1rem; }
    .lg-btn { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; height: 3rem; border: 0; border-radius: 9999px; cursor: pointer;
        font: inherit; font-size: .9375rem; font-weight: 600; color: #fff; background: var(--lg-accent);
        box-shadow: 0 1px 2px rgb(15 23 42 / .15), 0 10px 24px -12px rgb(79 70 229 / .6); transition: transform .12s, box-shadow .2s, background-color .2s; }
    .lg-btn:hover { background: var(--lg-accent-hover); box-shadow: 0 1px 2px rgb(15 23 42 / .15), 0 14px 28px -12px rgb(79 70 229 / .7); }
    .lg-btn:active { transform: scale(.985); }
    .lg-btn:focus-visible { outline: 3px solid rgb(129 140 248 / .5); outline-offset: 2px; }
    .lg-btn svg { width: 18px; height: 18px; transition: transform .15s; }
    .lg-btn:hover svg { transform: translateX(2px); }
    .lg-btn[disabled] { cursor: progress; opacity: .85; }
    .lg-spin { display: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .35); border-top-color: #fff; animation: lg-rot .7s linear infinite; }
    .lg-btn.is-busy .lg-spin { display: block; }
    .lg-btn.is-busy .lg-arrow { display: none; }
    @keyframes lg-rot { to { transform: rotate(360deg); } }
    .lg-foot { margin-top: 1.25rem; font-size: .75rem; color: var(--lg-muted); }
    @media (max-width: 480px) { .lg-mascot { width: 7rem; } .lg-card { padding: 1.25rem; border-radius: 1.5rem; } }
    @media (prefers-reduced-motion: reduce) { .lg-mascot, .lg-mascot img, .lg-brand, .lg-tag, .lg-foot, .lg-card { animation: none; } .lg-spin { animation-duration: 1.4s; } }
    </style>
</head>
<body>
    <main class="lg-wrap">
        <div id="loginMascot" class="lg-mascot">
            <img src="{{ url_for('static', filename='img/mascot.png') }}" alt="Evonic Mascot">
        </div>
        <h1 class="lg-brand">EVONIC</h1>
        <p class="lg-tag">Sign in to continue</p>

        <div class="lg-card">
            {% if notice %}
            <div class="lg-notice" role="status">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                <span>{{ notice }}</span>
            </div>
            {% endif %}
            {% if error %}
            <div class="lg-error" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" id="loginForm">
                <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">
                <input type="hidden" name="csrf_token" id="csrf_token_field" value="">

                <label class="lg-label" for="lg-password">Password</label>
                <div class="lg-field">
                    <svg class="lg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="lg-password" name="password" required autocomplete="current-password" autofocus placeholder="Enter your password" class="lg-input">
                    <button type="button" class="lg-eye" id="lg-eye" aria-label="Show password" aria-pressed="false">
                        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                    </button>
                </div>

                {% if turnstile_site_key %}
                <div class="lg-turnstile">
                    <div class="cf-turnstile" id="turnstile-widget" data-sitekey="{{ turnstile_site_key }}" data-theme="light"></div>
                </div>
                <script>
                // Set Turnstile theme based on current mode
                (function() {
                    var isDark = document.documentElement.classList.contains('dark');
                    var widget = document.getElementById('turnstile-widget');
                    if (widget && isDark) {
                        widget.setAttribute('data-theme', 'dark');
                    }
                })();
                </script>
                {% endif %}

                <button type="submit" class="lg-btn" id="lg-submit">
                    <span class="lg-label-text">Sign In</span>
                    <svg class="lg-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    <span class="lg-spin" aria-hidden="true"></span>
                </button>
            </form>
        </div>
        {% if evonic_version %}<div class="lg-foot">Evonic v{{ evonic_version }}</div>{% endif %}
    </main>
    <script>
    (function() {
        var m = document.cookie.match('(?:^|; )csrf_token=([^;]*)');
        if (m) document.getElementById('csrf_token_field').value = decodeURIComponent(m[1]);

        // Show / hide password
        var pw = document.getElementById('lg-password'), eye = document.getElementById('lg-eye');
        eye.addEventListener('click', function() {
            var show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            eye.classList.toggle('is-shown', show);
            eye.setAttribute('aria-pressed', String(show));
            eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            pw.focus();
        });

        // Busy state on submit (also stops double submits)
        var form = document.getElementById('loginForm'), btn = document.getElementById('lg-submit');
        form.addEventListener('submit', function() {
            if (!form.checkValidity()) return;
            btn.classList.add('is-busy');
            btn.querySelector('.lg-label-text').textContent = 'Signing in…';
            setTimeout(function() { btn.disabled = true; }, 0);   // after the submit has been dispatched
        });
        // Back/forward cache: never come back stuck in the busy state
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) { btn.disabled = false; btn.classList.remove('is-busy'); btn.querySelector('.lg-label-text').textContent = 'Sign In'; }
        });
    })();
    </script>
</body>
</html>
