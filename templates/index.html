{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=24">
<div class="p-4 md:p-6">

    <!-- ═══ Needs attention (filled by JS; hidden when there is nothing to flag) ═══ -->
    <section id="attention" class="dash-attn hidden" aria-label="Needs attention">
        <div class="dash-attn-h"><h3>Needs attention</h3><span id="attention-count" class="dash-attn-n"></span></div>
        <div id="attention-list" class="dash-attn-list"></div>
    </section>

    <!-- ═══ One compact stat strip ═══ -->
    <div class="dash-stats">
        <a href="/agents" class="dash-stat">
            <span class="dash-stat-ic dash-t-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-agent-count"><span class="dash-skel"></span></span></div>
                <div class="dash-stat-l">Agents</div>
                <div class="dash-stat-s">&nbsp;</div>
            </div>
        </a>
        <div class="dash-stat">
            <span class="dash-stat-ic dash-t-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-session-count"><span class="dash-skel"></span></span></div>
                <div class="dash-stat-l">Conversations</div>
                <div class="dash-stat-s">&nbsp;</div>
            </div>
        </div>
        <a href="/system#tools" class="dash-stat">
            <span class="dash-stat-ic dash-t-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-tool-count"><span class="dash-skel"></span></span></div>
                <div class="dash-stat-l">Registered tools</div>
                <div class="dash-stat-s">&nbsp;</div>
            </div>
        </a>
        <a href="/agents" class="dash-stat">
            <span class="dash-stat-ic dash-t-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-active-channel-count">–</span><span class="dash-of">/<span id="stat-channel-count">–</span></span></div>
                <div class="dash-stat-l">Channels active</div>
                <div class="dash-stat-s"><span id="stat-channel-sub">&nbsp;</span></div>
            </div>
        </a>
        <a href="/skills" class="dash-stat">
            <span class="dash-stat-ic dash-t-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-skill-enabled">–</span><span class="dash-of">/<span id="stat-skill-total">–</span></span></div>
                <div class="dash-stat-l">Skills enabled</div>
                <div class="dash-stat-s"><span id="stat-skill-skillsets">&nbsp;</span></div>
            </div>
        </a>
        <a href="/plugins" class="dash-stat">
            <span class="dash-stat-ic dash-t-violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-plugin-enabled">–</span><span class="dash-of">/<span id="stat-plugin-total">–</span></span></div>
                <div class="dash-stat-l">Plugins active</div>
                <div class="dash-stat-s">&nbsp;</div>
            </div>
        </a>
        <a href="/scheduler" class="dash-stat">
            <span class="dash-stat-ic dash-t-sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
            <div class="dash-stat-tx">
                <div class="dash-stat-v"><span id="stat-schedule-active">–</span><span class="dash-of">/<span id="stat-schedule-total">–</span></span></div>
                <div class="dash-stat-l">Schedules active</div>
                <div class="dash-stat-s"><span id="stat-schedule-sub">&nbsp;</span></div>
            </div>
        </a>
    </div>

    <!-- ═══ Leaderboard | model distribution ═══ -->
    <div class="dash-row dash-row-21">
        <div class="dash-card">
            <div class="dash-card-h"><h3 class="text-base font-semibold text-gray-800 dark:text-gray-100 m-0">Model Leaderboard</h3></div>
            <div id="chart-leaderboard" class="dash-chart"><div class="dash-chart-skel"></div></div>
        </div>
        <div id="top-right" class="dash-slot">
            <div id="model-usage-card" class="dash-card">
                <div class="dash-card-h"><h3 class="text-base font-semibold text-gray-800 dark:text-gray-100 m-0">Model distribution</h3></div>
                <div id="chart-model-usage" class="dash-chart"><div class="dash-chart-skel"></div></div>
            </div>
        </div>
    </div>

    <!-- Plugin cards: own row, one column per card (hidden until plugins provide cards) -->
    <div id="plugin-cards-container" class="dash-plugins" style="display:none"></div>
</div>
<script src="{{ url_for('static', filename='js/apexcharts.min.js') }}?v=1"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}?v=38"></script>
{% endblock %}
