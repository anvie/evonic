openapi: 3.0.0
info:
  title: Order Service API
  version: 1.0.0
  description: A REST API for managing orders.
servers:
  - url: http://localhost:7300
paths:
  /orders:
    get:
      summary: List orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created successfully
        '400':
          description: Invalid input
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        item:
          type: string
        quantity:
          type: integer
        price:
          type: number
      required:
        - item
        - quantity
