openapi: 3.0.0
info:
  title: Order Management API
  version: 1.0.0
  description: A simple REST API for managing orders.
paths:
  /orders:
    get:
      summary: List all orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: A brief description of the order.
              required:
                - description
        description: Order object to be created
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Missing description
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    description: Endpoints for managing orders.
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the order
        description:
          type: string
          description: Description of the order
        status:
          type: string
          description: Current status of the order (e.g., pending)
      example:
        id: 1
        description: "Test order"
        status: "pending"
